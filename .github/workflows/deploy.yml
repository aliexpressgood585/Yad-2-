name: Deploy to Vercel

# פריסה אוטומטית בכל דחיפה לענף הראשי, ואפשרות להריץ ידנית מלשונית Actions.
#
# נדרשים שלושה secrets במאגר (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — מתוך .vercel/project.json אחרי `vercel link`
#   VERCEL_PROJECT_ID  — מאותו קובץ
#
# משתני הסביבה של האפליקציה (DATABASE_URL וכו') נשמרים ב-Vercel עצמו,
# לא כאן — כך שאין צורך לשכפל סודות בין שתי המערכות.

on:
  push:
    branches:
      - main
      - claude/israeli-classifieds-platform-iyb4jf
  workflow_dispatch:
    inputs:
      seed:
        description: "לזרוע נתוני דמו אחרי הפריסה"
        type: boolean
        default: false

concurrency:
  # פריסה אחת בכל רגע; דחיפה חדשה מבטלת פריסה שעדיין רצה
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      # מסלול הפריסה הזה הוא **חלופי** לחיבור Git המובנה של Vercel.
      #
      # כשהחיבור המובנה פעיל, Vercel פורס כל דחיפה בעצמה, והרצה הזאת
      # מיותרת. כישלון שלה על סוד חסר אינו מדווח על תקלת פריסה אלא על
      # מסלול שלא נבחר — ובפועל הוא שלח מייל כישלון על כל דחיפה, שהסתיר
      # את הכישלון האמיתי של Vercel עצמה.
      #
      # לכן חוסר סודות מדלג ולא נכשל. מי שרוצה שהפריסה תרוץ דווקא מכאן
      # מוסיף את שלושת הסודות, והשלבים הבאים נדלקים מאליהם.
      - name: בדיקה שהסודות הוגדרו
        id: secrets
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::הפריסה מ-GitHub מדולגת — חסרים secrets:$missing"
            echo "אם Vercel מחוברת ישירות למאגר, זה המצב התקין והפריסה מתבצעת שם."
            echo "כדי לפרוס דווקא מכאן: Settings → Secrets and variables → Actions"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "כל הסודות קיימים"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: התקנת Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: משיכת הגדרות הפרויקט מ-Vercel
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: בנייה
        # `vercel build` מריץ את הסקריפט vercel-build שבו רצות המיגרציות,
        # עם משתני הסביבה שנמשכו בשלב הקודם.
        if: steps.secrets.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: פריסה
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"

      - name: זריעת נתוני דמו
        if: steps.secrets.outputs.ready == 'true' && inputs.seed
        run: |
          npm ci
          # DIRECT_URL נמשך מ-Vercel אל .vercel/.env.production.local
          set -a && . .vercel/.env.production.local && set +a
          DATABASE_URL="$DIRECT_URL" npm run db:seed

      - name: סיכום
        if: steps.secrets.outputs.ready == 'true'
        run: |
          {
            echo "### האתר נפרס"
            echo ""
            echo "**${{ steps.deploy.outputs.url }}**"
            echo ""
            echo "התחברות כמנהל: \`admin@kedai.co.il\` / \`Password123!\`"
          } >> "$GITHUB_STEP_SUMMARY"
